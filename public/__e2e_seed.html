<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>e2e seed</title>
  </head>
  <body>
    <script>
      // 仅用于本地端到端验证
      // ?w=屏蔽词  &r=目标路由(EventList|EventList_sports)  &m=1 预置一条「已隐藏」事件
      const p = new URLSearchParams(location.search);
      localStorage.clear();
      localStorage.setItem("polymarket-block-words", p.get("w") || "");
      if (p.get("m") === "1") {
        localStorage.setItem(
          "e2e-managed-placeholder",
          JSON.stringify({
            id: "0",
            slug: "e2e-managed-placeholder",
            title: "【测试占位】已隐藏事件",
            updateStatus: "隐藏",
          })
        );
      }
      location.replace("/#/" + (p.get("r") || "EventList"));
    </script>
  </body>
</html>
